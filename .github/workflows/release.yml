name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test backend
        run: |
          python -m pip install --upgrade pip pytest
          python -m compileall -q backend runtime main.py scripts
          pytest -q

      - name: Build frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          pnpm build

      - name: Package Decky plugin
        run: python scripts/package.py

      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          ASSET="build/ROGAllyAudio-v${VERSION}.zip"
          LATEST_ASSET="build/ROGAllyAudio.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "ROG Ally Audio ${VERSION}"
            git push origin "$TAG"
          fi

          gh release create "$TAG" "$ASSET" "$LATEST_ASSET" \
            --title "ROG Ally Audio ${VERSION}" \
            --notes-file RELEASE_NOTES.md
